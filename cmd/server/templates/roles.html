{{define "roles.html"}}{{template "base-start" .}}<div class="page-heading"><h1>Roles</h1><p>Associe os nomes usados na planilha às roles do OZmap.</p></div><section class="card"><form id="role-form" class="role-form"><label for="role-name">Nome da role<input id="role-name" placeholder="Ex.: COMERCIAL" required></label><label for="role-id">OZmap Role ID<input id="role-id" placeholder="ID da role no OZmap" required></label><button class="primary">Salvar role</button></form></section><section class="card"><div class="table-wrap"><table><thead><tr><th>Nome</th><th>OZmap Role ID</th><th>Ações</th></tr></thead><tbody id="roles">{{range .Roles}}<tr><td>{{.Name}}</td><td><code>{{.OZMapRoleID}}</code></td><td><button data-delete="{{.ID}}">Excluir</button></td></tr>{{else}}<tr><td colspan="3">Nenhuma role cadastrada.</td></tr>{{end}}</tbody></table></div></section><script src="/static/roles.js"></script>{{template "base-end" .}}{{end}}
